<div class="page-with-sidebar">
<div class="region-page">

  <nav class="breadcrumb" aria-label="위치">
    <a href="/">홈</a>
    <span>›</span>
    <span>종류별</span>
  </nav>

  <div class="region-page-header">
    <h1>🏷️ 겨울간식 종류별 찾기</h1>
    <p>붕어빵·호떡·토스트·어묵·꽈배기 등 종류를 선택하세요</p>
  </div>

  <div class="ad-slot">
    {% include ad.html %}
  </div>

  <div class="cat-btn-grid">

    {% endfor %}

  <div class="tip-box">
    <h2>어떤 가게가 들어 있나요?</h2>

  </div>

</div>

</div>
