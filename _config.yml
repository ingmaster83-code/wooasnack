title: 우아간식 - 우리 동네 붕어빵·호떡·토스트 찾기
description: >-
  동네 이름으로 붕어빵·호떡·토스트·어묵·꽈배기 가게를 찾아보세요. 전국 동네별 겨울간식 가게의
  주소·전화번호와 근처 간식 가게를 공공 인허가 데이터로 안내합니다.
url: "https://wooasnack.wooahouse.com"
baseurl: ""
lang: ko
timezone: Asia/Seoul
author: WooaHouse

markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

plugins:
  - jekyll-seo-tag

exclude:
  - Gemfile
  - Gemfile.lock
  - scripts/
  - data/
  - "*.py"
  - "*.log"
  - README.md
  - .gitignore
  - .env
  - vendor/
  - _rawdata/

# 설계 메모: 행안부 LOCALDATA 일반음식점·제과점 인허가 CSV에서 상호에 간식명이 들어간 영업 점포를 추출(_rawdata/snk_{시도}.json),
# 동 허브(_rawdata/dongs.json: 중심좌표·근처 동·근처 점포)는 점포가 없는 동네도 생성해 "무슨동 붕어빵" 검색에 대응.
# 사이트맵은 snack_generator.rb 분할본.
